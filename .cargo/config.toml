# Cross-compilation targets for static musl binaries
#
# Use `cargo zigbuild` (requires `cargo install cargo-zigbuild` and zig on PATH).
# These linker entries are for environments where musl-tools is installed instead.
# On Ubuntu/Debian: sudo apt-get install musl-tools gcc-aarch64-linux-gnu musl-cross

[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
